name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  # A push to main does not always produce a run -- 2c73623 landed on main and
  # GitHub created no run for it at all, leaving the branch untested with no
  # way to ask for one. Every other trigger here is a thing that happened to
  # the repository; this is the one that lets a person say "test it anyway".
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Test both the floor declared in go.mod and the current release. The
    # floor is what consumers may actually build with; "stable" catches
    # forward-compatibility breakage before a Go release does.
    name: build & test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: [go.mod, stable]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        if: matrix.go == 'go.mod'
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-go@v7
        if: matrix.go != 'go.mod'
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Verify go.mod and go.sum are tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Verify module dependencies
        run: go mod verify

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:"
            echo "$unformatted"
            exit 1
          fi

      - name: Test
        run: go test -race -timeout 180s -covermode=atomic -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

  staticcheck:
    name: staticcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: dominikh/staticcheck-action@v1
        with:
          version: latest
          install-go: false

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  surface:
    # The v1 audit measured the exported API by hand, twice, and the second
    # pass missed a whole package. Freezing a surface at v1 is a promise held
    # until v2, so the number is checked on every push rather than whenever
    # somebody remembers to look.
    name: surface
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check the exported API against its budget
        run: go run ./internal/cmd/surface -check docs/surface-budget.txt
